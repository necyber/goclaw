openapi: 3.0.3
info:
  title: Goclaw HTTP API
  version: "1.0.0"
  description: Week 5 aligned HTTP API contract for workflow orchestration and service probes.
servers:
  - url: /
paths:
  /api/v1/workflows:
    get:
      summary: List workflows
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 100
            minimum: 0
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Submit workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRequest"
      responses:
        "201":
          description: Workflow accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workflows/{id}:
    get:
      summary: Get workflow status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStatusResponse"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workflows/{id}/cancel:
    post:
      summary: Cancel workflow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Workflow cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/workflows/{id}/tasks/{tid}/result:
    get:
      summary: Get task result
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: tid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Terminal task result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResultResponse"
        "409":
          description: Task result not yet available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Service ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Service not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /status:
    get:
      summary: Runtime status
      responses:
        "200":
          description: Runtime metadata and component/system status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
components:
  schemas:
    WorkflowRequest:
      type: object
      required: [name, tasks]
      properties:
        name:
          type: string
        description:
          type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskDefinition"
    TaskDefinition:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        dependencies:
          type: array
          items:
            type: string
        depends_on:
          type: array
          items:
            type: string
    WorkflowResponse:
      type: object
      properties:
        id:
          type: string
        workflow_id:
          type: string
        name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        message:
          type: string
    WorkflowStatusResponse:
      type: object
      properties:
        id:
          type: string
        workflow_id:
          type: string
        name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    WorkflowSummary:
      type: object
      properties:
        id:
          type: string
        workflow_id:
          type: string
        name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        task_count:
          type: integer
    WorkflowListResponse:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowSummary"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    TaskResultResponse:
      type: object
      properties:
        workflow_id:
          type: string
        task_id:
          type: string
        status:
          type: string
        result: {}
        error:
          type: string
        completed_at:
          type: string
          format: date-time
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        error:
          type: string
    ComponentCheck:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    ReadyResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentCheck"
        error:
          type: string
    StatusRuntime:
      type: object
      properties:
        state:
          type: string
        go_version:
          type: string
        num_cpu:
          type: integer
        goroutines:
          type: integer
    StatusSystem:
      type: object
      properties:
        memory_alloc_bytes:
          type: integer
          format: uint64
        memory_sys_bytes:
          type: integer
          format: uint64
    StatusResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        uptime:
          type: string
        timestamp:
          type: string
          format: date-time
        runtime:
          $ref: "#/components/schemas/StatusRuntime"
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentCheck"
        system:
          $ref: "#/components/schemas/StatusSystem"
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
